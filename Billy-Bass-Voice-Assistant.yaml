esphome:
  name: "billy-bass"
  friendly_name: Billy Bass

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3  
  flash_size: 16MB
  framework:
    type: esp-idf

    version: recommended
    sdkconfig_options:
      # ESP32-S3 N16R8
      CONFIG_ESP32_S3_BOX_BOARD: "y"
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB:      "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B:  "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y" 

psram:
  mode: octal
  speed: 80MHz

logger:

ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


external_components:
  - source:
      type: git
      url: https://github.com/Cian911/billy-ai
      ref: main
    components: [speaker_tap]


api:
  on_client_connected:
        then:
          - micro_wake_word.start:
  on_client_disconnected:
        then:
          - voice_assistant.stop: 


# add empty sensor so speaker_tap can compile
sensor:


# ---------- Outputs ----------
output:

  - platform: gpio
    pin: 
      number: GPIO014
      allow_other_uses: true
    id: set_low_speaker  # reduce popping on speaker start


  - platform: ledc
    pin: GPIO10 # was 32
    id: motor_forward_pin
    frequency: 20000 Hz

  - platform: ledc
    pin: GPIO11 # was 14
    id: motor_reverse_pin
    frequency: 20000 Hz

  - platform: ledc
    frequency: 20000 Hz
    pin: GPIO16 # was 23
    id: motor2_forward_pin

  - platform: ledc
    pin: GPIO17 # was 22
    frequency: 20000 Hz
    id: motor2_reverse_pin    

  - platform: ledc
    frequency: 20000 Hz
    pin: GPIO08 # was 23
    id: motor3_forward_pin

  - platform: ledc
    pin: GPIO09 # was 22
    frequency: 20000 Hz
    id: motor3_reverse_pin    




globals:
  - id: mouth_is_open
    type: bool
    restore_value: no
    initial_value: "false"
  - id: last_pulse_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: random_reply
    type: int
    restore_value: no
    initial_value: '0'

  - id: done_talking   
    type: int
    restore_value: no
    initial_value: '0'

  - id: songnum   
    type: int
    restore_value: no
    initial_value: '0'

  - id: songtime   
    type: int
    restore_value: no
    initial_value: '0'

  - id: call_action   
    type: int
    restore_value: no
    initial_value: '0'

  - id: wake_response   
    type: int
    restore_value: no
    initial_value: '0'



audio_file:
  - id: wake_sound    
    file:
      type: local
      path: "audio/what.mp3"

  - id: wake_sound2
    file:
      type: local
      path: "audio/whatsup.mp3"

  - id: wake_sound3
    file:
      type: local
      path: "audio/whatuwant.mp3"

  - id: wake_sound4
    file:
      type: local
      path: "audio/sup.mp3"


  - id: river_song
    file:
      type: local
      path: "audio/river_song7.mp3"

