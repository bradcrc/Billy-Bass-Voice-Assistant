script:     ###############################################################


  - id: mouth_open_pulse    ###################
    mode: single
    then:
      - delay: 100ms
      - lambda: |-      
          auto call = id(mouth_motor).turn_on();
          call.set_direction(FanDirection::FORWARD);
          call.set_speed(100);
          call.perform();
      - delay: 100ms

      - if:
          condition:
            lambda: 'return ((random_uint32() % 10) > 6);'
          then:
            - delay: 100ms

      - lambda: |-
          id(mouth_motor).turn_off().perform();
          id(done_talking) = 8;
      - delay: 60ms


  - id: mouth_open_keep    ###################
    mode: single
    then:
      - delay: 100ms
      - lambda: |-
          auto call = id(mouth_motor).turn_on();
          call.set_direction(FanDirection::FORWARD);
          call.set_speed(80);
          call.perform();
      - delay: 150ms

      - if:
          condition:
            lambda: 'return ((random_uint32() % 10) > 6);'
          then:
            - delay: 100ms

      - lambda: |-
          id(mouth_motor).turn_off().perform();
          id(done_talking) = 8;       
      - delay: 110ms


  - id: mouth_close_pulse    ###################
    mode: restart
    then:
      - lambda: "id(mouth_motor).turn_off().perform();"    
      - delay: 10ms       
      - lambda: |-
          auto call = id(mouth_motor).turn_on();
          call.set_direction(FanDirection::REVERSE);
          call.set_speed(100);
          call.perform();
      - delay: 150ms
      - lambda: |-
          id(mouth_motor).turn_off().perform();
          id(done_talking) = 8;         
      - delay: 100ms      



  - id: finished_speaking    ###################
    mode: restart
    then:
      - lambda: |-
          auto call = id(mouth_motor).turn_on();
          call.set_direction(FanDirection::REVERSE);
          call.set_speed(75);
          call.perform();
      - lambda: "id(head_motor).turn_off().perform();"    
      - delay: 160ms 
      - lambda: |-
          auto c = id(tail_motor).turn_on();
          c.set_direction(FanDirection::FORWARD);
          c.set_speed(100);
          c.perform();
      - delay: 110ms 
      - lambda: "id(tail_motor).turn_off().perform();"
      - lambda: |-
          auto c = id(tail_motor).turn_on();
          c.set_direction(FanDirection::REVERSE);
          c.set_speed(100);
          c.perform();
      - delay: 60ms 
      - lambda: "id(tail_motor).turn_off().perform();"           
      - delay: 460ms 
      - lambda: |-
          auto c = id(tail_motor).turn_on();
          c.set_direction(FanDirection::FORWARD);
          c.set_speed(100);
          c.perform();
      - delay: 120ms 
      - lambda: "id(tail_motor).turn_off().perform();"
      - lambda: "id(mouth_motor).turn_off().perform();"      
