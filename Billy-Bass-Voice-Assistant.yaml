esphome:
  name: "billy-bass"
  friendly_name: Billy Bass

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3  
  flash_size: 16MB
  framework:
    type: esp-idf

    version: recommended
    sdkconfig_options:
      # ESP32-S3 N16R8
      CONFIG_ESP32_S3_BOX_BOARD: "y"
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB:      "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B:  "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y" 

psram:
  mode: octal
  speed: 80MHz

logger:

ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


api:
  on_client_connected:
        then:
          - micro_wake_word.start:
  on_client_disconnected:
        then:
          - voice_assistant.stop: 


# ---------- Outputs ----------
output:

  - platform: gpio
    pin: 
      number: GPIO014
      allow_other_uses: true
    id: set_low_speaker         # reduce popping on speaker start


  - platform: ledc
    pin: GPIO10                 ### INT 1 (C-1)  ###
    id: motor_forward_pin
    frequency: 20000 Hz

  - platform: ledc
    pin: GPIO11                 ### INT 2 (C-1)  ###
    id: motor_reverse_pin
    frequency: 20000 Hz

  - platform: ledc
    pin: GPIO16                 ### INT 3 (C-1)  ###
    id: motor2_forward_pin
    frequency: 20000 Hz

  - platform: ledc
    pin: GPIO17                 ### INT 4 (C-1)  ###
    id: motor2_reverse_pin    
    frequency: 20000 Hz

  - platform: ledc
    pin: GPIO08                 ### INT 1 (C-2)  ###
    id: motor3_forward_pin
    frequency: 20000 Hz

  - platform: ledc
    pin: GPIO09                 ### INT 2 (C-2)  ###
    id: motor3_reverse_pin    
    frequency: 20000 Hz



globals:

  - id: random_reply
    type: int
    restore_value: no
    initial_value: '0'

  - id: done_talking   
    type: int
    restore_value: no
    initial_value: '0'

  - id: songnum   
    type: int
    restore_value: no
    initial_value: '0'

  - id: songtime   
    type: int
    restore_value: no
    initial_value: '0'

  - id: call_action   
    type: int
    restore_value: no
    initial_value: '0'

  - id: wake_response   
    type: int
    restore_value: no
    initial_value: '0'


  - id: is_speaking
    type: bool
    initial_value: "false"
    restore_value: no 

  - id: mouth_open
    type: bool
    restore_value: no
    initial_value: "false"



audio_file:
  - id: wake_sound    
    file:
      type: local
      path: "audio/what.mp3"

  - id: wake_sound2
    file:
      type: local
      path: "audio/whatsup.mp3"

  - id: wake_sound3
    file:
      type: local
      path: "audio/whatuwant.mp3"

  - id: wake_sound4
    file:
      type: local
      path: "audio/sup.mp3"


## Music On Board

  - id: river_song
    file:
      type: local
      path: "audio/river_song7.mp3"

  - id: happy_song
    file:
      type: local
      path: "audio/be_happy.mp3"





number:

  # Allow trigger for shared animations from other animated fish
  - platform: template
    name: "Remote Song"
    id: remote_song
    internal: false
    optimistic: true
    min_value: 0
    max_value: 10
    restore_value: False
    initial_value: 0
    step: 1
    set_action:
      - lambda: |-
         if (x == 5) {
           id(songtime) = 102;
           id(songnum) = 5;           
          }
         if (x == 6) {
           id(songtime) = 116;
           id(songnum) = 6;           
          }
      - logger.log: "Remote Song Init"
            


# Big red button on fish
binary_sensor:
  - platform: gpio
    id: red_button
    name: "Bass Red Button"

    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
      inverted: true

    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

    on_press:
      - logger.log: "Button pressed"
      - lambda: |-      
         if (id(songnum)==2) { 
            id(sing_river).press();         
         } else {
            id(sing_happy).press();
         }

    on_release:
      - logger.log: "Button released"




###############################################################################################################################

i2s_audio:   ##########################################################
  - id: mic_i2s
    i2s_lrclk_pin: GPIO01       ###  WS   ###
    i2s_bclk_pin: GPIO05        ###  SCK  ###
  - id: spk_i2s
    i2s_lrclk_pin: GPIO06       ### LRC   ###
    i2s_bclk_pin: GPIO07        ### BCLK  ###

microphone:    ########################################################
  - platform: i2s_audio
    id: mic
    i2s_audio_id: mic_i2s
    adc_type: external        
    i2s_din_pin: GPIO04         ### SD  ###
    channel: left    
    pdm: false


speaker:   ############################################################
  - platform: i2s_audio
    id: big_speaker
    i2s_audio_id: spk_i2s
    i2s_dout_pin: 
      number: GPIO014          ### DIN  ###
      allow_other_uses: true
    dac_type: external
    channel: mono
    sample_rate: 16000

  - platform: mixer
    id: mixer_speaker_id
    output_speaker: big_speaker
    num_channels: 1
    source_speakers:
      - id: announcement_spk_mixer_input
      - id: media_spk_mixer_input

  - platform: resampler
    id: media_spk_resampling_input
    output_speaker: media_spk_mixer_input
    task_stack_in_psram: True    
    sample_rate: 16000    

  - platform: resampler
    id: announcement_spk_resampling_input
    output_speaker: announcement_spk_mixer_input
    task_stack_in_psram: True    
    sample_rate: 16000


media_player:    ###########################################################
   - platform: speaker
     id: billy_bass_media_player
     name: Billy Bass Media Player
     announcement_pipeline:
       speaker: announcement_spk_resampling_input 
       num_channels: 1
       format: MP3
       sample_rate: 16000       

     media_pipeline:
       speaker: media_spk_resampling_input
       num_channels: 1
       format: MP3
       sample_rate: 16000



     on_announcement:
       - logger.log: "Announcing!!------------------------------------------------"
       - delay: 200ms       
       - lambda: "id(is_speaking) = true;"



     on_idle:
       - logger.log: "Playback finished!!------------------------------------------------"

       - lambda: |-      
          if (id(is_speaking)== true) {            
              id(is_speaking) = false;
              id(finished_speaking).execute();
          }



voice_assistant:   ###########################################################
  id: assist
  microphone: mic
  micro_wake_word: mww
  media_player: billy_bass_media_player
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 3.0



  on_error:
    - micro_wake_word.stop:
    - logger.log: "** VA ERROR **"    
    - lambda: "id(error_action).execute();" 
    - delay: 200ms       
    - micro_wake_word.start:     


  on_end:
    - logger.log: "** VA END **"        
    - lambda: "id(head_motor).turn_off().perform();"    
    - lambda: "id(mouth_motor).turn_off().perform();"  
    - micro_wake_word.stop:
    - wait_until:
        not:
          voice_assistant.is_running:
    - micro_wake_word.start:      
    

  on_stt_end:
    - logger.log: "** STT END **"
    - lambda: "id(head_motor).turn_off().perform();"    
    - lambda: "id(mouth_motor).turn_off().perform();"    









micro_wake_word:   ###########################################################
  id: mww
  microphone:
    microphone: mic
    channels: 0
    gain_factor: 4
  vad:
    
 
  models:
    - model: "https://raw.githubusercontent.com/TaterTotterson/microWakeWords/refs/heads/main/microWakeWords/hey_billy.json"
      id: hey_billy    
      probability_cutoff: .98
      sliding_window_size: 8
      internal: false

#    - model: "https://raw.githubusercontent.com/TaterTotterson/microWakeWords/refs/heads/main/microWakeWords/ok_billy.json"
#      id: ok_billy    
#      internal: false



  on_wake_word_detected:
    - logger.log: "** WAKE WORD DETECTED**"       

    #   Look at person after woken up
    - lambda: |-
        auto c = id(head_motor).turn_on();
        c.set_direction(FanDirection::FORWARD);
        c.set_speed(100);
        c.perform();

    - delay: 700ms 
    - lambda: "id(wake_response)  = (random_uint32() % 4);"   # Pick a random reply to wake word

    - if:
        condition:
          lambda: 'return id(wake_response) == 0;'
        then:
          - media_player.speaker.play_on_device_media_file:
              media_file: wake_sound
              announcement: False
  
    - if:
        condition:
          lambda: 'return id(wake_response) == 1;'
        then:
          - media_player.speaker.play_on_device_media_file:
              media_file: wake_sound2
              announcement: False

    - if:
        condition:
          lambda: 'return id(wake_response) == 2;'
        then:
          - media_player.speaker.play_on_device_media_file:
              media_file: wake_sound3
              announcement: False
  
    - if:
        condition:
          lambda: 'return id(wake_response) == 3;'
        then:
          - media_player.speaker.play_on_device_media_file:
              media_file: wake_sound4
              announcement: False


    - delay: 100ms 

    - lambda: |-
        auto c = id(mouth_motor).turn_on();
        c.set_direction(FanDirection::FORWARD);
        c.set_speed(90);
        c.perform();
    - delay: 200ms 

    - lambda: "id(mouth_motor).turn_off().perform();"
    - lambda: |-
        auto c = id(mouth_motor).turn_on();
        c.set_direction(FanDirection::REVERSE);
        c.set_speed(90);
        c.perform();
    - delay: 60ms 
    - lambda: "id(mouth_motor).turn_off().perform();"

    - delay: 100ms 

    - if:  # move mouth an extra syllable for some wake responses 
        condition:
          lambda: 'return (id(wake_response) == 1 || id(wake_response) == 2 );'
        then:
          - lambda: |-
              auto c = id(mouth_motor).turn_on();
              c.set_direction(FanDirection::FORWARD);
              c.set_speed(90);
              c.perform();
          - delay: 100ms 
          - lambda: "id(mouth_motor).turn_off().perform();"
          - lambda: |-
              auto c = id(mouth_motor).turn_on();
              c.set_direction(FanDirection::REVERSE);
              c.set_speed(90);
              c.perform();
          - delay: 60ms 
          - lambda: "id(mouth_motor).turn_off().perform();"

    - delay: 300ms  # delay so we don't reply to our own wake responses

    - voice_assistant.start:
        wake_word: !lambda return wake_word;













switch:    ###########################################################

  - platform: restart
    name: "Restart Device"

  - platform: template
    id: mute
    name: mute
    optimistic: true
    icon: "mdi:volume-mute"
    on_turn_on: 
      - micro_wake_word.stop:
      - voice_assistant.stop:

    on_turn_off:
      - micro_wake_word.start:



    

fan:   ###########################################################
  - platform: hbridge
    id: mouth_motor
    name: "Billy Bass Mouth"
    pin_a: motor_forward_pin
    pin_b: motor_reverse_pin
    decay_mode: FAST
    speed_count: 100
    internal: True

  - platform: hbridge
    id: head_motor
    name: "Billy Bass Head"
    pin_a: motor2_forward_pin
    pin_b: motor2_reverse_pin
    decay_mode: SLOW
    speed_count: 100
    internal: True

  - platform: hbridge
    id: tail_motor
    name: "Billy Bass Tail"
    pin_a: motor3_forward_pin
    pin_b: motor3_reverse_pin
    decay_mode: SLOW
    speed_count: 10
    internal: True











button:   ###############################################################
# Add buttons for some actions for fun and external automation 

  - platform: template
    name: "xCTRL Move Tail"
    id: tail_flap
    icon: "mdi:fish"
    on_press:
      - lambda: |-
          auto c = id(tail_motor).turn_on();
          c.set_direction(FanDirection::FORWARD);
          c.set_speed(90);
          c.perform();
      - delay: 240ms
      - lambda: |-
          auto c = id(tail_motor).turn_on();
          c.set_direction(FanDirection::REVERSE);
          c.set_speed(60);
          c.perform();                 
      - delay: 60ms
      - lambda: "id(tail_motor).turn_off().perform();"



  - platform: template    ###################
    name: "xCTRL Speaking"
    id: say_something
    icon: "mdi:account-voice"
    on_press:
      - lambda: |-
          auto c = id(head_motor).turn_on();
          c.set_direction(FanDirection::FORWARD);
          c.set_speed(90);
          c.perform();
      - delay: 509ms
      - lambda: |-
          auto c = id(mouth_motor).turn_on();
          c.set_direction(FanDirection::FORWARD);
          c.set_speed(90);
          c.perform();
      - delay: 350ms
      - lambda: |-
          auto c = id(mouth_motor).turn_on();
          c.set_direction(FanDirection::REVERSE);
          c.set_speed(80);
          c.perform();          
      - delay: 100ms
      - lambda: |-
          auto c = id(mouth_motor).turn_on();
          c.set_direction(FanDirection::FORWARD);
          c.set_speed(80);
          c.perform();
      - delay: 350ms
      - lambda: |-
          auto c = id(mouth_motor).turn_on();
          c.set_direction(FanDirection::REVERSE);
          c.set_speed(80);
          c.perform();    
      - delay: 100ms
      - lambda: "id(mouth_motor).turn_off().perform();"    
      - delay: 400ms      
      - lambda: "id(tail_motor).turn_off().perform();"
      - lambda: "id(head_motor).turn_off().perform();"  



  - platform: template     ###################
    name: "xCTRL Move Mouth"
    id: mouth_button
    icon: "mdi:fish"
    on_press:
      - lambda: |-
          auto c = id(mouth_motor).turn_on();
          c.set_direction(FanDirection::FORWARD);
          c.set_speed(100);
          c.perform();
      - delay: 350ms
      - lambda: |-
          auto c = id(mouth_motor).turn_on();
          c.set_direction(FanDirection::REVERSE);
          c.set_speed(100);
          c.perform();          
      - delay: 200ms  
      - lambda: "id(mouth_motor).turn_off().perform();"



  - platform: template    ###################
    name: "xCTRL Move Head"
    icon: "mdi:fish"
    on_press:
      - lambda: |-
          auto c = id(head_motor).turn_on();
          c.set_direction(FanDirection::FORWARD);
          c.set_speed(100);
          c.perform();
      - delay: 2000ms  
      - lambda: "id(head_motor).turn_off().perform();"



  - platform: template    ###################
    name: "xCTRL All Off"
    icon: "mdi:fish-off"
    on_press:
      - lambda: "id(tail_motor).turn_off().perform();"
      - lambda: "id(mouth_motor).turn_off().perform();"
      - lambda: "id(head_motor).turn_off().perform();"      



  - platform: template   ###################
    name: "Sing the River Song"
    id: sing_river
    icon: "mdi:sail-boat"
    on_press:
      - media_player.speaker.play_on_device_media_file:
          media_file: river_song 
          announcement: False           
      - lambda: "id(songtime) = 118;"
      - lambda: "id(songnum) = 1;"
      - homeassistant.service:
          service: number.set_value
          data:
            entity_id: number.trout_remote_song
            value: "6"


  - platform: template    ###################
    name: "Sing the Happy Song"
    id: sing_happy
    icon: "mdi:emoticon-happy"
    on_press:
      - media_player.speaker.play_on_device_media_file:
          media_file: happy_song
          announcement: False          
      - lambda: "id(songtime) = 100;"
      - lambda: "id(songnum) = 2;"
      - homeassistant.service:
          service: number.set_value
          data:
            entity_id: number.trout_remote_song
            value: "5"


  - platform: template    ###################
    name: "Sing a Song"
    icon: "mdi:music"
    on_press:
      - lambda: |-      
         if (id(songnum)==1) { 
            id(sing_happy).press();
         } else {
            id(sing_river).press();
         }













script:     ###############################################################



  - id: error_action    ###################
    mode: restart
    then:
    - lambda: "id(head_motor).turn_off().perform();"    
    - delay: 600ms 
    - lambda: |-
        auto c = id(tail_motor).turn_on();
        c.set_direction(FanDirection::FORWARD);
        c.set_speed(100);
        c.perform();
    - delay: 100ms 
    - lambda: "id(tail_motor).turn_off().perform();"
    - lambda: |-
        auto c = id(tail_motor).turn_on();
        c.set_direction(FanDirection::REVERSE);
        c.set_speed(70);
        c.perform();
    - delay: 60ms 
    - lambda: "id(tail_motor).turn_off().perform();"
    - delay: 600ms     
    - lambda: |-
        auto c = id(tail_motor).turn_on();
        c.set_direction(FanDirection::FORWARD);
        c.set_speed(100);
        c.perform();
    - delay: 100ms 
    - lambda: "id(tail_motor).turn_off().perform();"
    - lambda: |-
        auto c = id(tail_motor).turn_on();
        c.set_direction(FanDirection::REVERSE);
        c.set_speed(70);
        c.perform();
    - delay: 60ms 
    - lambda: "id(tail_motor).turn_off().perform();"
    - lambda: "id(mouth_motor).turn_off().perform();"  
    - lambda: "id(head_motor).turn_off().perform();" 



  - id: turn_all_off    ###################
    mode: restart
    then:
      - lambda: "id(tail_motor).turn_off().perform();"
      - lambda: "id(mouth_motor).turn_off().perform();"
      - lambda: "id(head_motor).turn_off().perform();"  





#################################################################################################################################
#  SPEAKING 

  - id: talking_1    ###################
    mode: single
    then:
      - logger.log: "talking 1 -- started ---------------------------------"      
      - lambda: "id(mouth_open) = true;" 
      - delay: 400ms      

      - if:
          condition:
            lambda: 'return (id(is_speaking) == true);'
          then:

            - lambda: |-      
                auto call = id(mouth_motor).turn_on();
                call.set_direction(FanDirection::FORWARD);
                call.set_speed(100);
                call.perform();
            - delay: 150ms

            - if:
                condition:
                  lambda: 'return ((random_uint32() % 10) > 6);'
                then:
                  - delay: 150ms
                  - if:
                      condition:
                        lambda: 'return ((random_uint32() % 10) > 6);'
                      then:
                        - delay: 150ms

            - lambda: |-
                id(mouth_motor).turn_off().perform();

            - delay: 160ms

            - lambda: |-
                auto call = id(mouth_motor).turn_on();
                call.set_direction(FanDirection::REVERSE);
                call.set_speed(100);
                call.perform();

            - if:
                condition:
                  lambda: 'return ((random_uint32() % 10) > 6);'
                then:
                  - delay: 100ms

            - delay: 260ms
      - lambda: "id(mouth_open) = false;" 
      - logger.log: "talking 1 -- done ---------------------------------"



  - id: talking_2    ###################
    mode: single
    then:
      - logger.log: "talking 2 -- started ---------------------------------"
      - lambda: "id(mouth_open) = true;" 
      - delay: 330ms   

      - if:
          condition:
            lambda: 'return (id(is_speaking) == true);'
          then:      

            - lambda: |-      
                auto call = id(mouth_motor).turn_on();
                call.set_direction(FanDirection::FORWARD);
                call.set_speed(100);
                call.perform();
            - delay: 100ms

            - if:
                condition:
                  lambda: 'return ((random_uint32() % 10) > 6);'
                then:
                  - delay: 50ms

            - lambda: |-
                id(mouth_motor).turn_off().perform();

            - delay: 160ms

            - if:
                condition:
                  lambda: 'return ((random_uint32() % 10) > 6);'
                then:
                  - delay: 140ms

            - lambda: |-
                auto call = id(mouth_motor).turn_on();
                call.set_direction(FanDirection::REVERSE);
                call.set_speed(100);
                call.perform();
            - delay: 170ms            
      - lambda: "id(mouth_open) = false;" 
      - logger.log: "talking 1 -- done ---------------------------------"



  - id: talking_3    ###################
    mode: restart
    then:
      - logger.log: "talking 3 -- started ---------------------------------"
      - lambda: "id(mouth_open) = true;" 
      - delay: 300ms    


      - if:
          condition:
            lambda: 'return (id(is_speaking) == true);'
          then:      

            - lambda: |-      
                auto call = id(mouth_motor).turn_on();
                call.set_direction(FanDirection::FORWARD);
                call.set_speed(100);
                call.perform();
            - delay: 100ms

            - if:
                condition:
                  lambda: 'return ((random_uint32() % 10) > 6);'
                then:
                  - delay: 50ms

            - lambda: |-
                id(mouth_motor).turn_off().perform();

            - delay: 200ms
            - if:
                condition:
                  lambda: 'return ((random_uint32() % 10) > 6);'
                then:
                  - delay: 100ms
            - lambda: |-
                auto call = id(mouth_motor).turn_on();
                call.set_direction(FanDirection::REVERSE);
                call.set_speed(100);
                call.perform();
            - delay: 140ms       

      - lambda: "id(mouth_open) = false;" 
      - logger.log: "talking 1 -- done ---------------------------------"




  - id: finished_speaking    ###################
    mode: restart
    then:
      - logger.log: "finished speaking -- started ---------------------------------"
      - lambda: |-
          id(mouth_motor).turn_off().perform();
          id(mouth_open) = false;
          id(head_motor).turn_off().perform();

      - delay: 10ms 

      - lambda: |-
          auto call = id(mouth_motor).turn_on();
          call.set_direction(FanDirection::REVERSE);
          call.set_speed(75);
          call.perform();
      - lambda: "id(head_motor).turn_off().perform();"    
      - delay: 160ms 
      - lambda: |-
          auto c = id(tail_motor).turn_on();
          c.set_direction(FanDirection::FORWARD);
          c.set_speed(100);
          c.perform();
      - delay: 310ms 
      - lambda: "id(tail_motor).turn_off().perform();"
      - lambda: |-
          auto c = id(tail_motor).turn_on();
          c.set_direction(FanDirection::REVERSE);
          c.set_speed(100);
          c.perform();
      - delay: 60ms 
      - lambda: "id(tail_motor).turn_off().perform();"           
      - lambda: "id(tail_motor).turn_off().perform();"
      - lambda: "id(mouth_motor).turn_off().perform();" 
      - logger.log: "finished speaking - ended ---------------------------------"  







#################################################################################################################################
#  SINGING 

  - id: sing_3    ###################
    mode: restart
    then:
      - lambda: |-
          auto c = id(head_motor).turn_on();
          c.set_direction(FanDirection::FORWARD);
          c.set_speed(100);
          c.perform();
      - delay: 509ms
      - lambda: |-
          auto c = id(mouth_motor).turn_on();
          c.set_direction(FanDirection::FORWARD);
          c.set_speed(100);
          c.perform();
