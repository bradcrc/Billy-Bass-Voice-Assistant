###############################################################################################################################





i2s_audio:   ##########################################################
  - id: mic_i2s
    i2s_lrclk_pin: GPIO01
    i2s_bclk_pin: GPIO05
  - id: spk_i2s
    i2s_lrclk_pin: GPIO06
    i2s_bclk_pin: GPIO07

microphone:    ########################################################
  - platform: i2s_audio
    id: mic
    i2s_audio_id: mic_i2s
    adc_type: external        
    i2s_din_pin: GPIO04
    channel: left    
    pdm: false


speaker:   ############################################################
  - platform: i2s_audio
    id: big_speaker
    i2s_audio_id: spk_i2s


    i2s_dout_pin: 
      number: GPIO014
      allow_other_uses: true
    dac_type: external
    


  - platform: speaker_tap
    id: spk_tap
    sink: big_speaker
    num_channels: "1"
    gain: 3.0
    attack_ms: 18
    release_ms: 120
    publish_interval: 100ms
    sample_rate: 16000     
    level:
      id: audio_level
      name: "Audio Level"
      on_value:
        then:         
          - lambda: |-
              static float ema = 0.0f;
              const float alpha = 0.25f;
              float v = x;
              ema = (1.0f - alpha) * ema + alpha * v;

              const float OPEN_TH   = 7.0f;
              const float CLOSE_TH  = 6.0f;
              const uint32_t REFRESH_MS = 140;
              const uint32_t MIN_GAP_MS = 40;  
              const uint32_t FAILSAFE_MS = 900;

              static bool open = false;
              static uint32_t last_ms = 0;
              uint32_t now = millis();

              if (!open) {
                if (ema > OPEN_TH && (now - last_ms > MIN_GAP_MS)) {
                  id(mouth_open_pulse).execute();
                  open = true;
                  last_ms = now;
                }
              } else {
                if (ema > OPEN_TH) {
                  if (now - last_ms > REFRESH_MS) {
                    id(mouth_open_keep).execute();
                    last_ms = now;
                  }
                } else if (ema < CLOSE_TH) {
                  id(mouth_close_pulse).execute();
                  open = false;
                  last_ms = now;
                }
                if (open && (now - last_ms > FAILSAFE_MS)) {
                  id(mouth_close_pulse).execute();
                  open = false;
                  last_ms = now;
                }
              }



  - platform: mixer
    id: mixer_speaker_id
    output_speaker: big_speaker
    num_channels: 1
    source_speakers:
      - id: announcement_spk_mixer_input
      - id: media_spk_mixer_input

  - platform: resampler
    id: media_spk_resampling_input
    output_speaker: media_spk_mixer_input
    task_stack_in_psram: True    

  - platform: resampler
    id: announcement_spk_resampling_input
    output_speaker: announcement_spk_mixer_input
    task_stack_in_psram: True    



media_player:    ###########################################################
   - platform: speaker
     id: billy_bass_media_player
     name: Billy Bass Media Player

     announcement_pipeline:
       speaker: announcement_spk_resampling_input 
       num_channels: 1
       format: MP3

     media_pipeline:
       speaker: media_spk_resampling_input
       format: MP3
       num_channels: 1



micro_wake_word:   ###########################################################
  id: mww
  microphone:
    microphone: mic
    channels: 0
    gain_factor: 4
  vad:
  models:
    - model: "https://raw.githubusercontent.com/TaterTotterson/microWakeWords/refs/heads/main/microWakeWords/hey_billy.json"
      id: hey_billy    

  on_wake_word_detected:
    - logger.log: "** WAKE WORD DETECTED**"       

    - lambda: |-
        auto c = id(head_motor).turn_on();
        c.set_direction(FanDirection::FORWARD);
        c.set_speed(100);
        c.perform();

    - delay: 700ms 

    - lambda: "id(wake_response)  = (random_uint32() % 3);"    
    - if:
        condition:
          lambda: 'return id(wake_response) == 0;'
        then:
          - media_player.speaker.play_on_device_media_file:
              media_file: wake_sound
  
    - if:
        condition:
          lambda: 'return id(wake_response) == 1;'
        then:
          - media_player.speaker.play_on_device_media_file:
              media_file: wake_sound2

    - if:
        condition:
          lambda: 'return id(wake_response) == 2;'
        then:
          - media_player.speaker.play_on_device_media_file:
              media_file: wake_sound3
  
    - if:
        condition:
          lambda: 'return id(wake_response) == 3;'
        then:
          - media_player.speaker.play_on_device_media_file:
              media_file: wake_sound4


    - delay: 100ms 

    - lambda: |-
        auto c = id(mouth_motor).turn_on();
        c.set_direction(FanDirection::FORWARD);
        c.set_speed(100);
        c.perform();
    - delay: 200ms 

    - lambda: "id(mouth_motor).turn_off().perform();"
    - lambda: |-
        auto c = id(mouth_motor).turn_on();
        c.set_direction(FanDirection::REVERSE);
        c.set_speed(100);
        c.perform();
    - delay: 60ms 
    - lambda: "id(mouth_motor).turn_off().perform();"

    - delay: 100ms 

    - if:  # another syllable 
        condition:
          lambda: 'return (id(wake_response) == 1 || id(wake_response) == 2 );'
        then:
          - lambda: |-
              auto c = id(mouth_motor).turn_on();
              c.set_direction(FanDirection::FORWARD);
              c.set_speed(100);
              c.perform();
          - delay: 100ms 
          - lambda: "id(mouth_motor).turn_off().perform();"
          - lambda: |-
              auto c = id(mouth_motor).turn_on();
              c.set_direction(FanDirection::REVERSE);
              c.set_speed(100);
              c.perform();
          - delay: 60ms 
          - lambda: "id(mouth_motor).turn_off().perform();"

    - delay: 300ms 



    - voice_assistant.start:
        wake_word: !lambda return wake_word;





voice_assistant:   ###########################################################
  id: assist
  microphone: mic
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 3.0
  speaker: spk_tap


  on_error:
    - micro_wake_word.stop:
    - logger.log: "** VA ERROR **"    
    - lambda: "id(error_action).execute();" 
    - delay: 200ms       
    - micro_wake_word.start:     


  on_end:
    - logger.log: "** VA END **"        
    - lambda: "id(head_motor).turn_off().perform();"    
    - lambda: "id(mouth_motor).turn_off().perform();"  
    - micro_wake_word.stop:
    - wait_until:
        not:
          voice_assistant.is_running:
    - micro_wake_word.start:      
    

  on_stt_end:
    - logger.log: "** STT END **"
    - lambda: "id(head_motor).turn_off().perform();"    
    - lambda: "id(mouth_motor).turn_off().perform();"    


  on_tts_start:
    - logger.log: "** TTS START **"   




switch:    ###########################################################

  - platform: restart
    name: "Restart Device"

  - platform: template
    id: mute
    name: mute
    optimistic: true
    icon: "mdi:volume-mute"
    on_turn_on: 
      - micro_wake_word.stop:
      - voice_assistant.stop:

    on_turn_off:
      - micro_wake_word.start:



    

