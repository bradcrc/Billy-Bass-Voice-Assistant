time:     ###############################################################
  - platform: homeassistant
    id: my_time

interval:
  - interval: 250ms
    then:
      - if:            # After finished speaking for a bit, Close the mouth and flap the tail to let us know you're done.
          condition:
            lambda: 'return id(done_talking) > 0;'
          then:
            - lambda: |-
                id(done_talking)--;
                if (id(done_talking) == 0 ) {
                  id(finished_speaking).execute();                 
                }

      - if:
          condition:    # If a song is currently playing, Check for animation keyframes
            lambda: 'return id(songtime) > 0;'
          then:
            - lambda: |-
                id(songtime)--;
                
                if (id(songnum)==1) { 
                    // Take me to the River Song
                    // Singing Animation
                    if (id(songtime)==70) { id(call_action) = 4;}
                    if (id(songtime)==55) { id(call_action) = 4;}
                    if (id(songtime)==40) { id(call_action) = 4;}
                    if (id(songtime)==24) { id(call_action) = 4;}

                    // Tail Animation
                    if (id(songtime)==100) { id(call_action) = 2;}
                    if (id(songtime)==90) { id(call_action) = 2;}
                    if (id(songtime)==80) { id(call_action) = 2;}
                    if (id(songtime)==10) { id(call_action) = 2;}

                } else {
                    // Dont Worry Song
                    //Singing Animation
                    if (id(songtime)==77) { id(call_action) = 3;}
                    if (id(songtime)==65) { id(call_action) = 3;}  
                    if (id(songtime)==33) { id(call_action) = 3;}
                    if (id(songtime)==20) { id(call_action) = 3;}

                    // Tail Animation
                    if (id(songtime)==7) { id(call_action) = 4;}  
                    if (id(songtime)==97) { id(call_action) = 2;}
                    if (id(songtime)==88) { id(call_action) = 2;}
                    if (id(songtime)==50) { id(call_action) = 2;}                                                       
                }
            

      # Perform Animation by running scripts
      - if:
          condition:
            lambda: 'return id(call_action) == 2;'
          then:
            - lambda: |-
                id(call_action) = 0;
                id(tail_move).execute(); 
            - logger.log: "Tail Flap" 

      - if:
          condition:
            lambda: 'return id(call_action) == 3;'
          then:
            - lambda: |-
                id(call_action) = 0;
                id(sing_3).execute(); 
            - logger.log: "Singing 3"  

      - if:
          condition:
            lambda: 'return id(call_action) == 4;'
          then:
            - lambda: |-
                id(call_action) = 0;
                id(sing_4).execute(); 
            - logger.log: "Singing 4"  





